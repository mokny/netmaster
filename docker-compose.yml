services:
  netmaster:
    build: .
    # network_mode: host statt Portmapping - die "Explore"-Netzwerkerkennung
    # (ARP-/Ping-Sweep + Port-Scan per nmap) braucht direkten Zugriff auf das
    # LAN-Interface des Hosts, den es im isolierten Docker-Bridge-Netz nicht
    # gäbe. Der Container lauscht dadurch direkt auf Port 3000 des Hosts
    # (steuerbar über PORT), ein HOST_BIND/HOST_PORT-Portmapping entfällt.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      NODE_ENV: production
      # HOST_PORT wird hier zum tatsächlichen Listen-Port der App, da
      # unter network_mode: host kein Docker-Portmapping mehr existiert.
      PORT: ${HOST_PORT:-3000}
      DATABASE_URL: "file:/app/data/netmaster.db"
      MASTER_SECRET: ${MASTER_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@netmaster.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-now}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      # Kontaktangabe im VAPID-JWT für Web-Push. Muss auf eine mailto:- oder
      # https:-Adresse mit echtem Hostnamen zeigen - "localhost" (der
      # bisherige interne Default) wird von Apples Push-Dienst mit
      # "BadJwtToken" abgelehnt, siehe web-push/src/vapid-helper.js.
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      NAS_INTERNAL_SECRET: ${NAS_INTERNAL_SECRET}
      NAS_GATEWAY_INTERNAL_URL: ${NAS_GATEWAY_INTERNAL_URL:-http://localhost:4501}
    volumes:
      - netmaster-data:/app/data
    restart: unless-stopped

  # Zentraler NAS-Zugriff (Web/FTP/SFTP/Samba) auf Freigaben, die tatsächlich
  # auf beliebigen von NetMaster verwalteten Servern liegen. Optional - nur
  # gestartet, wenn COMPOSE_PROFILES die "nas"-Profile-Zeile enthält.
  netmaster-nas-gateway:
    build: ./gateway
    profiles: ["nas"]
    depends_on:
      - netmaster
    # network_mode: host aus demselben Grund wie beim Hauptcontainer (siehe
    # oben) - Samba/FTP/SFTP müssen auf dem echten Host-Interface lauschen,
    # nicht im isolierten Docker-Bridge-Netz.
    network_mode: host
    # SYS_ADMIN + /dev/fuse für SSHFS-Mounts (FUSE-Dateisysteme im Container).
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    environment:
      NAS_MAIN_API_URL: ${NAS_MAIN_API_URL:-http://localhost:3000}
      NAS_INTERNAL_SECRET: ${NAS_INTERNAL_SECRET}
      NAS_FTP_ENABLED: ${NAS_FTP_ENABLED:-true}
      NAS_FTP_PORT: ${NAS_FTP_PORT:-21}
      NAS_FTPS_ENABLED: ${NAS_FTPS_ENABLED:-false}
      NAS_FTPS_PORT: ${NAS_FTPS_PORT:-990}
      NAS_FTP_TLS_CERT_PATH: ${NAS_FTP_TLS_CERT_PATH}
      NAS_FTP_TLS_KEY_PATH: ${NAS_FTP_TLS_KEY_PATH}
      NAS_FTP_PASV_URL: ${NAS_FTP_PASV_URL}
      NAS_SFTP_PORT: ${NAS_SFTP_PORT:-2222}
      NAS_FILES_API_PORT: ${NAS_FILES_API_PORT:-4501}
    volumes:
      - netmaster-nas-mounts:/mnt/nas
      - netmaster-nas-gateway-etc:/etc/netmaster-nas
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    depends_on:
      - netmaster
    # Ebenfalls Host-Networking: unter network_mode: host gibt es kein
    # Compose-internes DNS mehr, über das "netmaster" auflösbar wäre - Caddy
    # erreicht die App stattdessen über localhost:3000 (siehe Caddyfile).
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  netmaster-data:
  caddy-data:
  caddy-config:
  netmaster-nas-mounts:
  netmaster-nas-gateway-etc:
