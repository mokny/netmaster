services:
  netmaster:
    build: .
    ports:
      # HOST_BIND defaults to 0.0.0.0 (publicly reachable). install.sh sets it
      # to 127.0.0.1 when a Caddy proxy is used, since Caddy reaches this
      # container directly over the internal Docker network regardless of
      # this host-port mapping.
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "file:/app/data/netmaster.db"
      MASTER_SECRET: ${MASTER_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@netmaster.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-now}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
    volumes:
      - netmaster-data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    depends_on:
      - netmaster
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  netmaster-data:
  caddy-data:
  caddy-config:
