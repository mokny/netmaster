services:
  netmaster:
    build: .
    # network_mode: host statt Portmapping - die "Explore"-Netzwerkerkennung
    # (ARP-/Ping-Sweep + Port-Scan per nmap) braucht direkten Zugriff auf das
    # LAN-Interface des Hosts, den es im isolierten Docker-Bridge-Netz nicht
    # gäbe. Der Container lauscht dadurch direkt auf Port 3000 des Hosts
    # (steuerbar über PORT), ein HOST_BIND/HOST_PORT-Portmapping entfällt.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      NODE_ENV: production
      # HOST_PORT wird hier zum tatsächlichen Listen-Port der App, da
      # unter network_mode: host kein Docker-Portmapping mehr existiert.
      PORT: ${HOST_PORT:-3000}
      DATABASE_URL: "file:/app/data/netmaster.db"
      MASTER_SECRET: ${MASTER_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@netmaster.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-now}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      # Kontaktangabe im VAPID-JWT für Web-Push. Muss auf eine mailto:- oder
      # https:-Adresse mit echtem Hostnamen zeigen - "localhost" (der
      # bisherige interne Default) wird von Apples Push-Dienst mit
      # "BadJwtToken" abgelehnt, siehe web-push/src/vapid-helper.js.
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    volumes:
      - netmaster-data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    depends_on:
      - netmaster
    # Ebenfalls Host-Networking: unter network_mode: host gibt es kein
    # Compose-internes DNS mehr, über das "netmaster" auflösbar wäre - Caddy
    # erreicht die App stattdessen über localhost:3000 (siehe Caddyfile).
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  netmaster-data:
  caddy-data:
  caddy-config:
